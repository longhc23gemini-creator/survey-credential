<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survey — NCCL Tsinghua University</title>
<style>
  :root {
    --blue: #1a56db;
    --blue-light: #ebf5ff;
    --gray-50: #f7fafc;
    --gray-100: #f0f4f8;
    --gray-200: #e2e8f0;
    --gray-400: #a0aec0;
    --gray-500: #718096;
    --gray-600: #4a5568;
    --gray-700: #2d3748;
    --gray-900: #1a202c;
    --amber: #b7791f;
    --amber-bg: #fffbeb;
    --amber-border: #f6e05e;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
    background: linear-gradient(135deg, #f0f4f8 0%, #e8edf2 100%);
    color: var(--gray-900);
    line-height: 1.65;
    padding: 20px;
    min-height: 100vh;
  }
  .container {
    max-width: 600px;
    margin: 40px auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    padding: 44px 40px;
  }
  @media (max-width: 640px) {
    .container { padding: 28px 20px; margin: 20px auto; }
  }
  .institution {
    text-align: center;
    margin-bottom: 24px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--gray-200);
  }
  .institution-name {
    font-size: 13px;
    color: var(--gray-500);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .icon-block {
    text-align: center;
    font-size: 48px;
    margin: 20px 0 16px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 8px;
    color: var(--gray-900);
  }
  .subtitle {
    text-align: center;
    font-size: 14px;
    color: var(--gray-500);
    margin-bottom: 24px;
  }
  .message-box {
    background: var(--amber-bg);
    border: 1px solid var(--amber-border);
    border-radius: var(--radius);
    padding: 20px;
    margin: 20px 0;
    font-size: 14px;
    color: var(--gray-700);
    line-height: 1.7;
  }
  .message-box p { margin-bottom: 12px; }
  .message-box p:last-child { margin-bottom: 0; }
  .footer {
    text-align: center;
    margin-top: 32px;
    padding-top: 18px;
    border-top: 1px solid var(--gray-200);
    font-size: 12px;
    color: var(--gray-400);
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="container">
  <div class="institution">
    <div class="institution-name">New Construction Cross-Laboratory (NCCL)</div>
    <div class="institution-name">Tsinghua University</div>
  </div>

  <div class="icon-block" id="pageIcon">🙏</div>
  <h1 id="t-title"></h1>
  <p class="subtitle" id="t-subtitle"></p>

  <div class="message-box" id="t-message"></div>

  <div class="footer">
    New Construction Cross-Laboratory (NCCL), Tsinghua University<br>
    <a href="mailto:nccl@tsinghua.edu.cn" style="color:#718096;">nccl@tsinghua.edu.cn</a>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const countryParam = (params.get("country") || "INT").toUpperCase();

// 德国：支持 DE 或 GERMANY
// 英中双语：新加坡（SG/SINGAPORE）+ 中国大陆（CN/CHINA (MAINLAND)）+ 香港（HK/HONG KONG SAR）+ 澳门（MO/MACAO SAR）+ 台湾（TW/TAIWAN）
const lang = (countryParam === "DE" || countryParam === "GERMANY") ? "de"
           : (countryParam === "SG" || countryParam === "SINGAPORE" 
              || countryParam === "CN" || countryParam === "CHINA (MAINLAND)"
              || countryParam === "HK" || countryParam === "HONG KONG SAR"
              || countryParam === "MO" || countryParam === "MACAO SAR"
              || countryParam === "TW" || countryParam === "TAIWAN") ? "sg"
           : "en";

const T = {
  en: {
    title: "Thank you for your interest",
    subtitle: "",
    message: '<p>Thank you for taking the time to participate in our study.</p><p>After reviewing your responses, we regret to inform you that you do not meet the specific eligibility criteria for this phase of the research.</p><p>We sincerely appreciate your willingness to contribute.</p>'
  },
  de: {
    title: "Vielen Dank für Ihr Interesse / Thank you for your interest",
    subtitle: "",
    message: 'Wir danken Ihnen für Ihre Bereitschaft, an unserer Studie teilzunehmen.<br>Thank you for taking the time to participate in our study.<br><br>Nach Prüfung Ihrer Antworten müssen wir Ihnen leider mitteilen, dass Sie die spezifischen Teilnahmevoraussetzungen für diese Forschungsphase nicht erfüllen.<br>After reviewing your responses, we regret to inform you that you do not meet the specific eligibility criteria for this phase of the research.<br><br>Wir wissen Ihr Engagement sehr zu schätzen.<br>We sincerely appreciate your willingness to contribute.'
  },
  sg: {
    title: "Thank you for your interest / 感谢您的关注",
    subtitle: "",
    message: '<p>Thank you for taking the time to participate in our study.</p><p>感谢您抽出时间参与我们的研究。</p><p>After reviewing your responses, we regret to inform you that you do not meet the specific eligibility criteria for this phase of the research.</p><p>经过对您回答的审阅，很遗憾您不符合本研究阶段的特定资格要求。</p><p>We sincerely appreciate your willingness to contribute.</p><p>我们衷心感谢您的参与意愿。</p>'
  }
};

function render() {
  var t = T[lang];
  document.getElementById("t-title").textContent = t.title;
  document.getElementById("t-subtitle").textContent = t.subtitle;
  document.getElementById("t-message").innerHTML = t.message;
}
render();
</script>
<!-- 移除了 Cloudflare 的 beacon 脚本，避免显示问题 -->
</body>
</html>

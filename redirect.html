<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f7fafc;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    max-width: 420px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    padding: 48px 36px;
    text-align: center;
  }
  .spinner {
    border: 4px solid #e2e8f0;
    border-top: 4px solid #1a56db;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-text {
    font-size: 16px;
    font-weight: 600;
    color: #2d3748;
  }
  .status-sub {
    font-size: 14px;
    color: #718096;
    margin-top: 4px;
  }
  .error-box {
    display: none;
    margin-top: 20px;
  }
  .error-box.visible { display: block; }
  .error-box .err-icon { font-size: 32px; margin-bottom: 8px; }
  .error-box .err-title {
    font-size: 16px;
    font-weight: 600;
    color: #c53030;
  }
  .error-box .err-desc {
    font-size: 14px;
    color: #4a5568;
    margin: 8px 0 16px;
    line-height: 1.6;
  }
  .retry-btn {
    background: #1a56db;
    color: #fff;
    border: none;
    padding: 10px 32px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .retry-btn:hover { background: #1e429f; }
  .retry-btn:disabled {
    background: #a0aec0;
    cursor: not-allowed;
  }
  .footer {
    margin-top: 24px;
    font-size: 12px;
    color: #a0aec0;
    border-top: 1px solid #e2e8f0;
    padding-top: 18px;
  }
  .footer a { color: #718096; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <!-- 加载状态（默认显示） -->
  <div id="loadingState">
    <div class="spinner"></div>
    <div class="status-text">Generating your credential...</div>
    <div class="status-sub">Please wait while we prepare your participation record.</div>
  </div>

  <!-- 错误状态（初始隐藏） -->
  <div class="error-box" id="errorState">
    <div class="err-icon">⚠️</div>
    <div class="err-title">Connection Issue</div>
    <div class="err-desc" id="errorDesc">
      We encountered a network issue while generating your credential.
      Please check your connection and try again.
    </div>
    <button class="retry-btn" id="retryBtn">Retry</button>
  </div>

  <div class="footer">
    <a href="mailto:nccl@tsinghua.edu.cn">nccl@tsinghua.edu.cn</a>
  </div>
</div>

<script>
(function() {
  var CREDENTIAL_BASE = 'https://longhc23gemini-creator.github.io/survey-credential/credential.html';
  var API_BASE = 'https://survey-counter.longhc23gemini.workers.dev';

  var loadingState = document.getElementById('loadingState');
  var errorState = document.getElementById('errorState');
  var retryBtn = document.getElementById('retryBtn');
  var errorDesc = document.getElementById('errorDesc');

  function showError(msg) {
    loadingState.style.display = 'none';
    errorState.classList.add('visible');
    if (msg) errorDesc.textContent = msg;
    retryBtn.disabled = false;
  }

  function showLoading() {
    loadingState.style.display = 'block';
    errorState.classList.remove('visible');
    retryBtn.disabled = true;
  }

  // ── 从 URL 获取参数（不设默认值，全部显式检查） ──
  var params = new URLSearchParams(window.location.search);
  var rid = params.get('rid');
  var token = params.get('token');
  var country = params.get('country');
  var lottery = params.get('lottery');
  var profession = params.get('profession');

  // ── 核心：直接调用 /generate-draw-code ──
  async function process() {
    showLoading();

    try {
      // ── 1. 检查所有参数是否完整（缺少任何一个都视为无效） ──
      if (!rid || !token || !country || lottery === null || lottery === undefined || !profession) {
        window.location.replace(CREDENTIAL_BASE);
        return;
      }

      // ── 2. 调用 Worker 生成 draw_code（Worker 内部完成所有验证） ──
      var genRes = await fetch(API_BASE + '/generate-draw-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          rid: rid,
          token: token,
          country: country,
          lottery: lottery,
          profession: profession
        })
      });

      // HTTP 状态非 2xx → 验证失败（token 无效/参数不匹配/rid 不匹配等）
      if (!genRes.ok) {
        window.location.replace(CREDENTIAL_BASE);
        return;
      }

      var genData = await genRes.json();

      // 业务层错误 → 验证失败
      if (genData.error) {
        window.location.replace(CREDENTIAL_BASE);
        return;
      }

      // ── 成功：跳转到凭证页 ──
      window.location.replace(CREDENTIAL_BASE + '?code=' + encodeURIComponent(genData.draw_code));

    } catch (err) {
      // ── 网络异常：停留并显示重试按钮 ──
      console.warn('Network error in redirect:', err);
      showError('Network connection issue. Please check your internet and retry.');
    }
  }

  // 绑定重试按钮
  retryBtn.addEventListener('click', function() {
    process();
  });

  // 立即执行
  process();
})();
</script>
</body>
</html>

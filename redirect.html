<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f7fafc;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    max-width: 420px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    padding: 48px 36px;
    text-align: center;
  }
  .spinner {
    border: 4px solid #e2e8f0;
    border-top: 4px solid #1a56db;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-text {
    font-size: 16px;
    font-weight: 600;
    color: #2d3748;
  }
  .status-sub {
    font-size: 14px;
    color: #718096;
    margin-top: 4px;
  }
  .error-box {
    display: none;
    margin-top: 20px;
  }
  .error-box.visible { display: block; }
  .error-box .err-icon { font-size: 32px; margin-bottom: 8px; }
  .error-box .err-title {
    font-size: 16px;
    font-weight: 600;
    color: #c53030;
  }
  .error-box .err-desc {
    font-size: 14px;
    color: #4a5568;
    margin: 8px 0 16px;
    line-height: 1.6;
  }
  .retry-btn {
    background: #1a56db;
    color: #fff;
    border: none;
    padding: 10px 32px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .retry-btn:hover { background: #1e429f; }
  .retry-btn:disabled {
    background: #a0aec0;
    cursor: not-allowed;
  }
  .footer {
    margin-top: 24px;
    font-size: 12px;
    color: #a0aec0;
    border-top: 1px solid #e2e8f0;
    padding-top: 18px;
  }
  .footer a { color: #718096; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <!-- 加载状态（默认显示） -->
  <div id="loadingState">
    <div class="spinner"></div>
    <div class="status-text">Generating your credential...</div>
    <div class="status-sub">Please wait while we prepare your participation record.</div>
  </div>

  <!-- 错误状态（初始隐藏） -->
  <div class="error-box" id="errorState">
    <div class="err-icon">⚠️</div>
    <div class="err-title">Connection Issue</div>
    <div class="err-desc" id="errorDesc">
      We encountered a network issue while generating your credential.
      Please check your connection and try again.
    </div>
    <button class="retry-btn" id="retryBtn">Retry</button>
  </div>

  <div class="footer">
    <a href="mailto:nccl@tsinghua.edu.cn">nccl@tsinghua.edu.cn</a>
  </div>
</div>

<!-- 隐藏的 form，用于提交请求 -->
<form id="submitForm" method="POST" action="https://survey-counter.longhc23gemini.workers.dev/generate-draw-code" target="hidden_iframe">
  <input type="hidden" name="rid" id="f_rid">
  <input type="hidden" name="token" id="f_token">
  <input type="hidden" name="country" id="f_country">
  <input type="hidden" name="lottery" id="f_lottery">
  <input type="hidden" name="profession" id="f_profession">
</form>

<!-- 隐藏的 iframe，用于接收响应 -->
<iframe name="hidden_iframe" style="display:none;"></iframe>

<script>
(function() {
  var CREDENTIAL_BASE = 'https://longhc23gemini-creator.github.io/survey-credential/credential.html';

  var loadingState = document.getElementById('loadingState');
  var errorState = document.getElementById('errorState');
  var retryBtn = document.getElementById('retryBtn');
  var errorDesc = document.getElementById('errorDesc');

  var submitForm = document.getElementById('submitForm');
  var f_rid = document.getElementById('f_rid');
  var f_token = document.getElementById('f_token');
  var f_country = document.getElementById('f_country');
  var f_lottery = document.getElementById('f_lottery');
  var f_profession = document.getElementById('f_profession');

  var iframe = document.querySelector('iframe[name="hidden_iframe"]');

  function showError(msg) {
    loadingState.style.display = 'none';
    errorState.classList.add('visible');
    if (msg) errorDesc.textContent = msg;
    retryBtn.disabled = false;
  }

  function showLoading() {
    loadingState.style.display = 'block';
    errorState.classList.remove('visible');
    retryBtn.disabled = true;
  }

  // ── 从 URL 获取参数 ──
  var params = new URLSearchParams(window.location.search);
  var rid = params.get('rid');
  var token = params.get('token');
  var country = params.get('country');
  var lottery = params.get('lottery');
  var profession = params.get('profession');

  // ── 检查参数完整性 ──
  function hasValidParams() {
    return rid && token && country && lottery !== null && lottery !== undefined && profession;
  }

  // ── 通过 iframe + form 提交 ──
  function process() {
    showLoading();

    if (!hasValidParams()) {
      window.location.replace(CREDENTIAL_BASE);
      return;
    }

    // 填写表单
    f_rid.value = rid;
    f_token.value = token;
    f_country.value = country;
    f_lottery.value = lottery;
    f_profession.value = profession;

    // 移除旧的 iframe 加载监听
    iframe.onload = null;

    // 设置超时
    var timeoutId = setTimeout(function() {
      showError('Request timed out. Please check your internet and retry.');
    }, 15000);

    // iframe 加载完成时触发
    iframe.onload = function() {
      clearTimeout(timeoutId);

      try {
        // 尝试读取 iframe 内容
        var doc = iframe.contentDocument || iframe.contentWindow.document;
        var content = doc.body.textContent || doc.body.innerText || '';

        // 尝试解析 JSON
        try {
          var data = JSON.parse(content);
          if (data.draw_code) {
            window.location.replace(CREDENTIAL_BASE + '?code=' + encodeURIComponent(data.draw_code));
            return;
          }
          if (data.error) {
            window.location.replace(CREDENTIAL_BASE);
            return;
          }
        } catch (e) {
          // 不是 JSON，尝试从 HTML 中提取 draw_code
          var match = content.match(/"draw_code"\s*:\s*"([^"]+)"/);
          if (match && match[1]) {
            window.location.replace(CREDENTIAL_BASE + '?code=' + encodeURIComponent(match[1]));
            return;
          }
        }

        // 无法解析，跳转无 code 凭证页
        window.location.replace(CREDENTIAL_BASE);

      } catch (e) {
        // 跨域读取失败，无法获取响应内容
        // 这种情况下，我们无法知道请求结果
        // 采用一个保守策略：等待几秒后如果页面没有跳转，显示错误
        var fallbackTimeout = setTimeout(function() {
          // 如果页面没有被跳转，显示错误
          // 但由于无法检测页面是否即将跳转，只能直接跳转无 code 凭证页
          // 这是最安全的方式
          window.location.replace(CREDENTIAL_BASE);
        }, 3000);

        // 如果 3 秒内页面未跳转，fallback 会执行
        // 但如果我们能检测到 iframe 中有内容，可以提前取消
        try {
          var doc2 = iframe.contentDocument || iframe.contentWindow.document;
          if (doc2 && doc2.body && doc2.body.textContent) {
            clearTimeout(fallbackTimeout);
            // 递归调用自身，再次尝试解析
            iframe.onload();
            return;
          }
        } catch (e2) {
          // 仍然跨域，让 fallback 执行
        }
      }
    };

    // 提交表单
    submitForm.submit();
  }

  // ── 重试 ──
  retryBtn.addEventListener('click', function() {
    process();
  });

  // ── 立即执行 ──
  process();
})();
</script>
</body>
</html>

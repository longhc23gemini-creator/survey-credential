<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f7fafc;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    max-width: 420px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    padding: 48px 36px;
    text-align: center;
  }
  .spinner {
    border: 4px solid #e2e8f0;
    border-top: 4px solid #1a56db;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-text {
    font-size: 16px;
    font-weight: 600;
    color: #2d3748;
  }
  .status-sub {
    font-size: 14px;
    color: #718096;
    margin-top: 4px;
  }
  .footer {
    margin-top: 24px;
    font-size: 12px;
    color: #a0aec0;
    border-top: 1px solid #e2e8f0;
    padding-top: 18px;
  }
  .footer a { color: #718096; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <div class="spinner"></div>
  <div class="status-text">Generating your credential...</div>
  <div class="status-sub">Please wait while we prepare your participation record.</div>
  <div class="footer">
    <a href="mailto:nccl@tsinghua.edu.cn">nccl@tsinghua.edu.cn</a>
  </div>
</div>

<!-- 隐藏 form，提交到当前窗口（_top） -->
<form id="submitForm" method="POST" action="https://survey-counter.longhc23gemini.workers.dev/generate-draw-code" target="_top">
  <input type="hidden" name="rid" id="f_rid">
  <input type="hidden" name="token" id="f_token">
  <input type="hidden" name="country" id="f_country">
  <input type="hidden" name="lottery" id="f_lottery">
  <input type="hidden" name="profession" id="f_profession">
</form>

<script>
(function() {
  var CREDENTIAL_BASE = 'https://longhc23gemini-creator.github.io/survey-credential/credential.html';
  var params = new URLSearchParams(window.location.search);

  var rid = params.get('rid');
  var token = params.get('token');
  var country = params.get('country');
  var lottery = params.get('lottery');
  var profession = params.get('profession');

  // ── 检查参数完整性 ──
  if (!rid || !token || !country || lottery === null || lottery === undefined || !profession) {
    window.location.replace(CREDENTIAL_BASE);
    return;
  }

  // ── 填写表单并提交 ──
  document.getElementById('f_rid').value = rid;
  document.getElementById('f_token').value = token;
  document.getElementById('f_country').value = country;
  document.getElementById('f_lottery').value = lottery;
  document.getElementById('f_profession').value = profession;

  document.getElementById('submitForm').submit();
})();
</script>
</body>
</html>
